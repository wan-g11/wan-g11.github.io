/* ---------- S0 基础工具 ---------- */
const W = 1280, H = 720;
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
// 自适应：画布按窗口尺寸 x 设备像素比渲染，逻辑坐标恒为 1280x720（铺满 + 清晰）
function fitCanvas() {
  const dpr = window.devicePixelRatio || 1;
  cvs.width = Math.max(1, Math.round(window.innerWidth * dpr));
  cvs.height = Math.max(1, Math.round(window.innerHeight * dpr));
  ctx.setTransform(cvs.width / W, 0, 0, cvs.height / H, 0, 0);
  ctx.imageSmoothingEnabled = true;
}
window.addEventListener('resize', fitCanvas);
const TAU = Math.PI * 2, RAD = Math.PI / 180;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
function rr(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
const FONT = '"Microsoft YaHei","PingFang SC",sans-serif';
function txt(c, s, x, y, size, color, align = 'center', outline = 0, oc = '#000', bold = true) {
  c.save();

/* ---------- S1 音效（WebAudio 合成） ---------- */
const SFX = {
  ctx: null, master: null, muted: false, chargeOsc: null, chargeGain: null,
  ensure() {
    if (!this.ctx) {

        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.master = this.ctx.createGain();
        this.master.gain.value = 0.5;
        this.master.connect(this.ctx.destination);
      } catch (e) { }
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(f0, f1, dur, type = 'sine', vol = 0.3, delay = 0) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(Math.max(1, f0), t);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.05);
  },
  noise(dur, vol = 0.4, fc = 800, delay = 0) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime + delay;
    const n = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = fc;
    const g = this.ctx.createGain(); g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t);
  },
  shoot() { this.tone(520, 160, 0.16, 'square', 0.16); this.noise(0.1, 0.1, 1400); },
  boom(s) { this.noise(0.45 + 0.35 * s, 0.5, 260 + 260 * s); this.tone(110, 38, 0.4 + 0.2 * s, 'sine', 0.45); },
  flame() { this.noise(0.55, 0.32, 900); this.tone(90, 140, 0.5, 'sawtooth', 0.08); },
  pickup() { this.tone(620, 940, 0.08, 'square', 0.18); this.tone(940, 1300, 0.09, 'square', 0.18, 0.08); },
  pop() { this.tone(320, 70, 0.13, 'square', 0.24); },
  thud() { this.tone(190, 55, 0.13, 'triangle', 0.32); },
  click() { this.tone(820, 620, 0.05, 'square', 0.1); },
  win() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, f, 0.17, 'square', 0.2, i * 0.13)); },
  lose() { this.tone(300, 150, 0.4, 'sawtooth', 0.18); this.tone(210, 85, 0.55, 'sawtooth', 0.18, 0.22); },
  chargeStart() {
    if (!this.ctx || this.muted || this.chargeOsc) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(110, t);
    o.frequency.linearRampToValueAtTime(560, t + 1.1);
    g.gain.value = 0.12;
    o.connect(g); g.connect(this.master); o.start(t);
    this.chargeOsc = o; this.chargeGain = g;
  },
  chargeStop() {
    if (this.chargeOsc) { try { this.chargeOsc.stop(); } catch (e) { } this.chargeOsc = null; }
  }
};

function dragAim(e) {
  // 从角色往鼠标方向拖 = 瞄准方向与力度
  const ox = e.x, oy = e.y - e.h * 0.55;

/* ---------- S3 地形 ---------- */
const CELL = 4, COLS = W / CELL, ROWS = H / CELL;
let grid = new Uint8Array(COLS * ROWS);
let terrainDirty = true;
const SS = 2; // 离屏画布2倍超采样，拉伸到全屏时依然清晰
const terrainCvs = document.createElement('canvas');
terrainCvs.width = W * SS; terrainCvs.height = H * SS;
const tctx = terrainCvs.getContext('2d');
tctx.scale(SS, SS);
const bgCvs = document.createElement('canvas');
bgCvs.width = W * SS; bgCvs.height = H * SS;
const bctx = bgCvs.getContext('2d');
let clouds = [];
const MAXSTEP = 11;

function genTerrain() {
  grid.fill(0);
  const base = ROWS * 0.74;
  const p1 = rand(0, 9), p2 = rand(0, 9), p3 = rand(0, 9);
  const a1 = rand(7, 16), a2 = rand(4, 10), a3 = rand(2, 6);
  const hs = new Float32Array(COLS);
  for (let c = 0; c < COLS; c++) {
    const t = c / COLS * Math.PI * 2;
    hs[c] = base + Math.sin(t * 1.3 + p1) * a1 + Math.sin(t * 2.7 + p2) * a2 + Math.sin(t * 5.1 + p3) * a3;
  }
  flatten(hs, 6, 30); flatten(hs, COLS - 30, COLS - 6);
  for (let c = 0; c < COLS; c++) {
    const top = Math.round(hs[c]);
    for (let r = top; r < ROWS; r++) grid[r * COLS + c] = 1;
  }
  terrainDirty = true;
}
function flatten(hs, c0, c1) {
  let sum = 0;
  for (let c = c0; c < c1; c++) sum += hs[c];
  const avg = sum / (c1 - c0);
  for (let c = c0; c < c1; c++) {
    const edge = Math.min(c - c0, c1 - 1 - c) / 6;
    const t = clamp(edge, 0, 1);
    hs[c] = lerp(hs[c], avg, t);
  }
}
function solidAt(x, y) {
  const c = (x / CELL) | 0, r = (y / CELL) | 0;
  if (c < 0 || c >= COLS || r < 0) return false;
  if (r >= ROWS) return true;
  return grid[r * COLS + c] === 1;
}
function groundTopY(x) {
  const c = clamp((x / CELL) | 0, 0, COLS - 1);
  for (let r = 0; r < ROWS; r++) if (grid[r * COLS + c]) return r * CELL;
  return H;
}
function carve(cx, cy, r) {
  const c0 = Math.max(0, ((cx - r) / CELL) | 0), c1 = Math.min(COLS - 1, ((cx + r) / CELL) | 0);
  const r0 = Math.max(0, ((cy - r) / CELL) | 0), r1 = Math.min(ROWS - 1, ((cy + r) / CELL) | 0);
  for (let c = c0; c <= c1; c++) for (let r = r0; r <= r1; r++) {
    const dx = c * CELL + CELL / 2 - cx, dy = r * CELL + CELL / 2 - cy;
    if (dx * dx + dy * dy <= r * r * rand(0.8, 1.15)) grid[r * COLS + c] = 0;
  }
  settleTerrain();
  terrainDirty = true;
}
function settleTerrain() {
  for (let c = 0; c < COLS; c++) {
    let write = ROWS - 1;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (grid[r * COLS + c]) {
        if (write !== r) { grid[write * COLS + c] = 1; grid[r * COLS + c] = 0; }
        write--;
      }
    }
  }
}
function rebuildTerrain() {
  tctx.clearRect(0, 0, W, H);
  for (let r = 0; r < ROWS; r++) {
    let c = 0;
    while (c < COLS) {
      const i = r * COLS + c;
      if (!grid[i]) { c++; continue; }
      const above = r > 0 ? grid[(r - 1) * COLS + c] : 0;
      const speck = ((c * 31 + r * 17) % 23) === 0;
      let code, color;
      if (!above) { code = 1; color = '#5CB43A'; }
      else if (speck) { code = 3; color = '#6E4425'; }
      else { code = 2; color = '#83552F'; }
      let c2 = c + 1;
      while (c2 < COLS && grid[r * COLS + c2]) {
        const ab2 = r > 0 ? grid[(r - 1) * COLS + c2] : 0;
        const sp2 = ((c2 * 31 + r * 17) % 23) === 0;
        const cd = !ab2 ? 1 : (sp2 ? 3 : 2);
        if (cd !== code) break;
        c2++;
      }
      tctx.fillStyle = color;
      tctx.fillRect(c * CELL, r * CELL, (c2 - c) * CELL, CELL);

}
function buildBackground() {
  bctx.setTransform(SS, 0, 0, SS, 0, 0);
  const g = bctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#6FC2F2'); g.addColorStop(0.55, '#A9DDF7'); g.addColorStop(1, '#DFF3FC');
  bctx.fillStyle = g; bctx.fillRect(0, 0, W, H);
  // 太阳
  bctx.save();
  bctx.fillStyle = '#FFE66B'; bctx.strokeStyle = 'rgba(255,230,107,.5)'; bctx.lineWidth = 10;
  bctx.beginPath(); bctx.arc(1080, 110, 46, 0, TAU); bctx.fill(); bctx.stroke();
  bctx.restore();
  // 远山
  const hills = [
    { c: '#B7DC9A', y: 470, amp: 60, f: 1.4, p: 2.1 },
    { c: '#9ACB79', y: 520, amp: 45, f: 2.2, p: 0.6 },
  ];
  for (const h of hills) {
    bctx.fillStyle = h.c; bctx.beginPath(); bctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 8) {
      const t = x / W * Math.PI * 2;
      bctx.lineTo(x, h.y - Math.abs(Math.sin(t * h.f + h.p)) * h.amp);
    }
    bctx.lineTo(W, H); bctx.closePath(); bctx.fill();
  }
  // 村庄小屋
  const houses = [[220, '#E86A5A'], [420, '#5A8FE8'], [880, '#E8A25A'], [1080, '#7BC46B']];
  for (const [hx, hc] of houses) {
    const hy = groundTopY(hx) + 6;
    bctx.fillStyle = '#F5E7C8'; bctx.fillRect(hx - 34, hy - 46, 68, 46);
    bctx.fillStyle = hc;
    bctx.beginPath(); bctx.moveTo(hx - 42, hy - 44); bctx.lineTo(hx, hy - 78); bctx.lineTo(hx + 42, hy - 44); bctx.closePath(); bctx.fill();
    bctx.fillStyle = '#8A5A33'; bctx.fillRect(hx - 10, hy - 26, 20, 26);
    bctx.fillStyle = '#BFE3F5'; bctx.fillRect(hx + 14, hy - 38, 14, 12);
  }
  // 树
  for (const tx of [130, 560, 700, 1150]) {
    const ty = groundTopY(tx) + 4;
    bctx.fillStyle = '#7A4E2C'; bctx.fillRect(tx - 4, ty - 30, 8, 30);
    bctx.fillStyle = '#4E9E3A';
    bctx.beginPath(); bctx.arc(tx, ty - 42, 18, 0, TAU); bctx.arc(tx - 13, ty - 32, 13, 0, TAU); bctx.arc(tx + 13, ty - 32, 13, 0, TAU); bctx.fill();
  }
  clouds = [];
  for (let i = 0; i < 6; i++) clouds.push({ x: rand(0, W), y: rand(40, 200), s: rand(0.6, 1.5) });
}

/* ---------- S4 粒子 / 浮动文字 ---------- */
let parts = [], texts = [];
function addPart(p) { parts.push(Object.assign({ life: 0.6, maxLife: 0.6, size: 4, color: '#fff', type: 'dot', vx: 0, vy: 0 }, p, { maxLife: p.life || 0.6 })); }
function addExplosion(x, y, r) {
  addPart({ x, y, size: r * 1.1, life: 0.13, color: '#FFFFFF', type: 'flash' });
  const n = Math.floor(r * 1.1);
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), sp = rand(30, r * 7);
    addPart({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - r * 2, size: rand(3, r * 0.16 + 4),
      life: rand(0.3, 0.7), color: ['#FFD23F', '#FF8C2E', '#FF5A2E'][i % 3], type: 'fire'
    });
  }
  for (let i = 0; i < n * 0.4; i++) {
    addPart({ x: x + rand(-r, r) * .5, y: y + rand(-r, r) * .5, vx: rand(-30, 30), vy: rand(-90, -30), size: rand(6, r * 0.3 + 6), life: rand(0.7, 1.4), color: 'rgba(120,110,100,.6)', type: 'smoke' });
  }
  for (let i = 0; i < n * 0.5; i++) {
    addPart({ x, y, vx: rand(-r * 4, r * 4), vy: rand(-r * 6, -r), size: rand(2, 5), life: rand(0.5, 1), color: ['#8A5A33', '#6E4425', '#5CB43A'][i % 3], type: 'debris' });
  }
}
function addDust(x, y, n) {
  for (let i = 0; i < n; i++) addPart({ x: x + rand(-8, 8), y, vx: rand(-25, 25), vy: rand(-35, -5), size: rand(2, 4), life: rand(0.3, 0.6), color: 'rgba(180,160,130,.7)', type: 'smoke' });
}
function addConfetti(x, y) {
  const cols = ['#FF5A7E', '#FFD23F', '#5CB43A', '#5AB0FF', '#B98CF5', '#FF8C2E'];
  for (let i = 0; i < 90; i++) {
    addPart({ x: x + rand(-40, 40), y: y - rand(0, 30), vx: rand(-160, 160), vy: rand(-330, -60), size: rand(3, 7), life: rand(1.2, 2.4), color: cols[i % cols.length], type: 'confetti' });
  }
}
function addText(x, y, s, size = 22, color = '#fff', life = 1.1) {
  texts.push({ x, y, s, size, color, life, maxLife: life, vy: -42 });
}
function updateParts(dt) {
  for (const p of parts) {
    p.life -= dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.type === 'fire') { p.vx *= 0.94; p.vy = p.vy * 0.94 + 60 * dt; }
    else if (p.type === 'smoke') { p.vy -= 12 * dt; p.vx *= 0.98; }
    else if (p.type === 'debris' || p.type === 'confetti') { p.vy += 700 * dt; p.vx *= 0.99; }
  }
  parts = parts.filter(p => p.life > 0);
  for (const t of texts) { t.life -= dt; t.y += t.vy * dt; t.vy *= 0.94; }
  texts = texts.filter(t => t.life > 0);
}

    if (p.type === 'flash') { c.fillStyle = p.color; c.beginPath(); c.arc(p.x, p.y, p.size * (1.4 - a), 0, TAU); c.fill(); }
    else if (p.type === 'confetti') { c.fillStyle = p.color; c.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size * 0.6); }
    else { c.fillStyle = p.color; c.beginPath(); c.arc(p.x, p.y, p.size * (p.type === 'smoke' ? (2 - a) : a + 0.3), 0, TAU); c.fill(); }
    c.restore();
  }
}
function drawTexts(c) {
  for (const t of texts) {
    const a = clamp(t.life / t.maxLife, 0, 1);
    c.save(); c.globalAlpha = Math.min(1, a * 2);
    txt(c, t.s, t.x, t.y, t.size, t.color, 'center', Math.max(3, t.size / 6), 'rgba(0,0,0,.75)');
    c.restore();
  }
}

/* ---------- S5 角色 ---------- */
const SKINS = {
  nailong: { body: '#F2C63F', line: '#C89A28', feet: '#C9992E', belly: '#FBF4DB', eye: '#2F5D2A', mode: 'normal', name: '奶龙' },
  boss: { body: '#E04138', line: '#A82820', feet: '#A82820', belly: '#F6E7C8', eye: '#FFFFFF', mode: 'devil', name: '暴暴龙' },
  lieutenant: { body: '#E04138', line: '#A82820', feet: '#A82820', belly: '#F6E7C8', eye: '#FFFFFF', mode: 'devil', name: '暴暴龙副官' },
  captain: { body: '#A87BE8', line: '#7E55C0', feet: '#7E55C0', belly: '#EFE6FB', eye: '#FFFFFF', mode: 'god', cap: true, name: '小紫兵队长' },
  minion: { body: '#A87BE8', line: '#7E55C0', feet: '#7E55C0', belly: '#EFE6FB', eye: '#FFFFFF', mode: 'god', name: '小紫兵' },
};
const SIZES = {
  nailong: { w: 48, h: 60, s: 1.0 }, boss: { w: 60, h: 74, s: 1.0 },
  lieutenant: { w: 56, h: 68, s: 1.0 }, captain: { w: 34, h: 44, s: 1.0 }, minion: { w: 26, h: 32, s: 1.0 },
};
class Ent {
  constructor(type, x, side, hp, ai, aiErr) {
    const sz = SIZES[type];
    this.type = type; this.skin = SKINS[type];
    this.x = x; this.y = groundTopY(x);
    this.w = sz.w; this.h = sz.h; this.s = sz.s;
    this.side = side; this.hp = hp; this.maxhp = hp;
    this.ai = ai; this.aiErr = aiErr || 4;
    this.alive = true; this.facing = side === 0 ? 1 : -1;
    this.angle = 45; this.charge = 0; this.fuel = 100;
    this.weapon = 0;
    this.ammo = [Infinity, 2, 1, 1, 3];
    this.buff = false; this.vy = 0; this.grounded = true;
    this.walkDir = 0; this.walkAnim = 0; this.fallStart = this.y;
    this.blinkT = rand(1, 4); this.flashT = 0; this.recoil = 0;
    this.aiState = ''; this.aiT = 0; this.aiPlan = null;
    this.dance = 0;
  }
  get cx() { return this.x; }
  get cy() { return this.y - this.h * 0.5; }
  update(dt) {
    if (!this.alive) return;
    this.flashT = Math.max(0, this.flashT - dt);
    this.recoil = Math.max(0, this.recoil - dt * 3);
    if (this.dance > 0) this.dance -= dt;
    // 走路
    if (this.walkDir !== 0 && this.fuel > 0 && this.grounded) {
      const spd = 72;
      let nx = clamp(this.x + this.walkDir * spd * dt, 24, W - 24);
      const gy = groundTopY(nx);
      if (gy > this.y - MAXSTEP) {
        this.x = nx;
        this.fuel = Math.max(0, this.fuel - spd * dt * 0.33);
        this.walkAnim += dt * 9;
        if (Math.random() < dt * 5) addDust(this.x, this.y, 1);
        if (this.type !== 'minion') this.facing = this.walkDir;
      }
    }
    // 竖直
    const gy = groundTopY(this.x);
    if (this.y < gy - 0.6) {
      if (this.grounded) this.fallStart = this.y;
      this.grounded = false;
      this.vy = Math.min(this.vy + 950 * dt, 950);
      this.y = Math.min(this.y + this.vy * dt, gy);
      if (this.y >= gy) {
        this.y = gy;
        const fd = this.y - this.fallStart;
        if (fd > 60) { const d = Math.round((fd - 60) * 0.45); this.hurt(d, '摔'); addText(this.x, this.y - this.h - 16, `哎哟摔了！ -${d}`, 20, '#FFB13F'); SFX.thud(); }

  const dir = foe.x >= e.x ? 1 : -1;
  let best = null;
  for (let a = 12; a <= 85; a += 2) {
    for (let p = 20; p <= 100; p += 3) {
      const pts = simulateShot(e.x, e.y - e.h * 0.55, a * RAD, p, dir);
      if (!pts.length) continue;
      const last = pts[pts.length - 1];
      const dSelf = dist(last[0], last[1], e.x, e.cy);
      let d = 1e9;
      for (const q of pts) { const dd = dist(q[0], q[1], tc.x, tc.y); if (dd < d) d = dd; }
      if (dSelf < 110) d += 420;
      if (!best || d < best.d) best = { d, a, p };
    }

  const err = e.aiErr;
  plan.angle = clamp(best.a + rand(-err, err), 8, 88);
  plan.power = clamp(best.p + rand(-err * 1.6, err * 1.6), 15, 100);
  plan.dir = dir;

}
function updateAI(e, dt) {

      break;
    case 'walk': {
      const dx = e.aiPlan.walk - e.x;
      e.walkDir = Math.abs(dx) < 6 ? 0 : Math.sign(dx);
      if (e.walkDir === 0 || e.fuel <= 12 || e.aiT > 2.6) {
        e.walkDir = 0;
        e.aiPlan = aiPlan(e); e.aiT = 0; e.aiState = 'turn';

    }
    case 'turn': {
      if (e.aiPlan.dir != null) e.facing = e.aiPlan.dir;
      const d = e.aiPlan.angle - e.angle, step = 150 * dt;
      if (Math.abs(d) <= step) { e.angle = e.aiPlan.angle; e.aiState = 'charge'; e.charge = 0; }

    }
    case 'charge':
      e.charge = Math.min(e.aiPlan.power, e.charge + 120 * dt);
      if (e.charge >= e.aiPlan.power) { e.aiState = 'done'; fireActive(); }
      break;

}

function updateGame(dt) {
  // 云随风格
  for (const cl of clouds) {
    cl.x += game.wind * 7 * dt + 6 * dt;
    if (cl.x > W + 80) cl.x = -80;
    if (cl.x < -80) cl.x = W + 80;
  }
  if (game.state !== 'play') { updateParts(dt); return; }  // 结算画面粒子继续飘
  if (game.paused) return;
  game.bannerT = Math.max(0, game.bannerT - dt);
  game.shakeT = Math.max(0, game.shakeT - dt);
  if (game.shakeT <= 0) game.shakeMag = 0;
  const e = activeEnt();

  if (game.phase === 'banner') {
    game.phaseT += dt;
    if (game.phaseT > 0.95) game.phase = 'aim';
  } else if (game.phase === 'aim') {
    if (e.ai) updateAI(e, dt);
    else {

      const up = e.side === 0 ? (keys['ArrowUp']) : (keys['KeyW']);
      const dn = e.side === 0 ? (keys['ArrowDown']) : (keys['KeyS']);
      const lf = e.side === 0 ? (keys['ArrowLeft']) : (keys['KeyA']);
      const rt = e.side === 0 ? (keys['ArrowRight']) : (keys['KeyD']);
      const fire = e.side === 0 ? (keys['Space']) : (keys['KeyJ']);
      if (up) e.angle = Math.min(88, e.angle + 80 * dt);
      if (dn) e.angle = Math.max(6, e.angle - 80 * dt);
      e.walkDir = (rt ? 1 : 0) + (lf ? -1 : 0);
      if (!mouse.dragStart) {
        if (fire) {
          if (WEAPONS[e.weapon].kind === 'flame') {
            if (!game.spaceWas) fireActive(); // 喷火即按即喷
          } else {
            e.charge += dt * 95;
            if (!game.spaceWas) SFX.chargeStart();
            if (e.charge >= 100) fireActive();
          }
        } else if (e.charge > 0 && game.spaceWas) {
          SFX.chargeStop();
          if (e.charge > 4) fireActive(); // 松开发射
          else e.charge = 0;
        }
      }
      game.spaceWas = !!fire;
    }
  } else if (game.phase === 'flying') {
    if (game.projs.length === 0 && flames.length === 0) {
      game.phase = 'resolve'; game.resolveT = 0;
    }
  } else if (game.phase === 'resolve') {
    game.resolveT += dt;
    const allGrounded = game.ents.filter(x => x.alive).every(x => x.grounded);
    if (game.resolveT > 0.55 && allGrounded) endTurn();
  }

  for (const en of game.ents) en.update(dt);
  // 弹道
  for (const p of game.projs) p.update(dt);

  game.projs = game.projs.filter(p => !p.dead);
  updateFlames(dt);
  for (const f of game.foods) f.update(dt);
  game.foods = game.foods.filter(f => f.life > 0);
  updateParts(dt);
}

  drawWorldBG();
  c.save();
  c.fillStyle = 'rgba(10,15,30,.42)'; c.fillRect(0, 0, W, H);
  c.restore();
  // 两条龙对峙
  const bob = Math.sin(performance.now() / 400) * 6;
  drawDragon(c, 'nailong', 300, 566 + bob, 1, 1, { dance: 0, sizeH: 185 });
  drawDragon(c, 'boss', 980, 566 - bob, 1, -1, { sizeH: 200 });
  txt(c, '奶龙大战暴暴龙', W / 2, 150, 76, '#FFD23F', 'center', 10, '#7A4E00');
  txt(c, '—— 干饭对决 ——', W / 2, 218, 30, '#fff', 'center', 6);
  btn('solo', '单人闯关', W / 2 - 240, 300, 220, 74);
  btn('duo', '双人对决', W / 2 + 20, 300, 220, 74);
  btn('howto', '玩法说明', W / 2 - 110, 400, 220, 58, { color: '#9BD4FF', dark: '#7BB8E8', size: 22 });
  // 纪录
  c.save();
  c.fillStyle = 'rgba(20,25,40,.55)';
  rr(c, W / 2 - 260, 486, 520, 58, 12); c.fill();
  txt(c, `单人纪录：${records.solo >= 3 ? '已通关！' : (records.solo > 0 ? '通过第 ' + records.solo + ' 关' : '尚未开战')}    双人战绩  奶龙 ${records.p1} 胜 ： 暴暴龙 ${records.p2} 胜`, W / 2, 515, 19, '#fff');
  c.restore();
  txt(c, 'M 静音 · 纯前端单文件 · 奶龙同人小游戏', W / 2, H - 24, 15, 'rgba(255,255,255,.55)');
}
function drawHowto() {
  const c = ctx;
  c.save();
  c.fillStyle = 'rgba(8,12,24,.88)'; c.fillRect(0, 0, W, H);
  txt(c, '玩法说明', W / 2, 80, 44, '#FFD23F', 'center', 7);
  const lines = [
    ['回合制炮术对决：轮流调角度、蓄力、看风，把对面轰成渣！', 20],
    ['↑ / ↓ 调整角度 ｜ 按住 空格 蓄力，松开发射 ｜ ← / → 移动（耗移动力）', 20],
    ['鼠标拖拽也能瞄准发射 ｜ 1~5 或点击面板换武器 ｜ P 暂停 ｜ M 静音', 20],
    ['', 10],
    ['每回合风力随机变化 —— 逆风加力，顺风减力，看屏幕上方的风向标', 20],
    ['地形会被炸出坑、炸塌方，掩体是打出来的', 20],
    ['每 3 回合空投外卖：奶茶回血 20，汉堡让下一发伤害 ×1.5，走过去捡！', 20],
    ['小紫兵是中立观众：会挡炮弹，还会偷吃你的外卖', 20],
    ['摔落也会掉血 —— 把对手脚下的山炸塌试试', 20],
    ['', 10],
    ['双人模式：1P 方向键 + 空格 ｜ 2P W A S D + J', 20],
    ['武器：烤串管饱 · 奶茶手雷溅射 · 龙蛋空中分裂 · 西兰花核弹清屏 · 近了就喷火', 20],
  ];
  let y = 150;
  for (const [s, size] of lines) {
    if (s) txt(c, s, W / 2, y, size, '#eef4ff', 'center', 3, 'rgba(0,0,0,.6)');
    y += 36;
  }
  btn('back', '知道啦！', W / 2 - 110, y + 16, 220, 60);
  c.restore();
}
function drawOver() {
  const c = ctx, info = game.overInfo;
  c.save();
  c.fillStyle = 'rgba(8,12,24,.72)'; c.fillRect(0, 0, W, H);
  const win = info.winner;
  if (win >= 0) {
    const we = game.ents.find(e => e.side === win);
    if (we) drawDragon(c, we.type, W / 2, 330, 1, win === 0 ? 1 : -1, { dance: Math.abs(Math.sin(performance.now() / 130)) * 20, sizeH: 150 });
  } else {
    drawDragon(c, 'nailong', W / 2 - 80, 330, 1, 1, { sizeH: 110 });
    drawDragon(c, 'boss', W / 2 + 80, 330, 1, -1, { sizeH: 120 });
  }
  txt(c, info.title, W / 2, 140, 56, win === 0 ? '#FFD23F' : (win === 1 ? '#C79BFF' : '#fff'), 'center', 8);
  txt(c, info.sub, W / 2, 420, 24, '#fff', 'center', 4);
  if (info.next) btn('next', '下一关 ▶', W / 2 - 240, 480, 220, 68);
  else btn('retry', '再来一局', W / 2 - 240, 480, 220, 68);
  btn('menu', '返回菜单', W / 2 + 20, 480, 220, 68, { color: '#9BD4FF', dark: '#7BB8E8' });
  c.restore();
}
function drawPause() {
  const c = ctx;
  c.save();
  c.fillStyle = 'rgba(8,12,24,.66)'; c.fillRect(0, 0, W, H);
  txt(c, '已暂停', W / 2, 240, 52, '#fff', 'center', 7);
  txt(c, '喝口奶茶休息一下', W / 2, 300, 22, '#cfe4ff');
  btn('resume', '继续战斗', W / 2 - 240, 360, 220, 64);
  btn('menu', '返回菜单', W / 2 + 20, 360, 220, 64, { color: '#9BD4FF', dark: '#7BB8E8' });
  c.restore();
}
function drawIntroHint() {
  // 关卡开场提示（开局前2回合显示）
  if (game.mode !== 'solo' || game.turn > 2) return;
  const lv = LEVELS[game.level];
  txt(ctx, `${lv.name}  ·  敌人血量 ${lv.hp}`, W / 2, 560, 26, '#fff', 'center', 5);
}
function drawWorldBG() {
  ctx.drawImage(bgCvs, 0, 0, W, H);
  // 云
  for (const cl of clouds) {
    ctx.save(); ctx.translate(cl.x, cl.y); ctx.scale(cl.s, cl.s);
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.beginPath();
    ctx.arc(0, 0, 22, 0, TAU); ctx.arc(24, 4, 16, 0, TAU); ctx.arc(-24, 5, 15, 0, TAU);
    ctx.fill(); ctx.restore();
  }
}

/* ---------- S10 渲染 ---------- */
function draw() {
  uiRects = [];
  ctx.clearRect(0, 0, W, H);
  drawWorldBG();
  if (game.state === 'menu') { drawMenu(); return; }
  if (game.state === 'howto') { drawHowto(); return; }
  // 世界（带震屏）
  ctx.save();
  if (game.shakeT > 0) {
    const m = game.shakeMag * (game.shakeT / 0.32);
    ctx.translate(rand(-m, m), rand(-m, m));
  }
  if (terrainDirty) rebuildTerrain();
  ctx.drawImage(terrainCvs, 0, 0, W, H);
  for (const f of game.foods) f.draw(ctx);
  for (const en of game.ents) if (en.side < 0) en.draw(ctx);
  for (const en of game.ents) if (en.side >= 0) en.draw(ctx);
  for (const p of game.projs) p.draw(ctx);
  drawParts(ctx);
  drawTexts(ctx);
  ctx.restore();
  drawHUD();
  drawIntroHint();
  if (game.state === 'over') drawOver();
  if (game.paused && game.state === 'play') drawPause();
}

/* ---------- S11 主循环 ---------- */
let lastT = performance.now();
function tick(t) {
  const dt = Math.min((t - lastT) / 1000, 1 / 30);
  lastT = t;
  updateGame(dt);
  draw();
  requestAnimationFrame(tick);
}
// 看门狗：rAF 被系统节流（如页面被遮挡）时兜底驱动，防止游戏假死；顺带轮询窗口尺寸变化
setInterval(() => {
  const now = performance.now();
  const dpr = window.devicePixelRatio || 1;
  const ew = Math.round(window.innerWidth * dpr), eh = Math.round(window.innerHeight * dpr);
  if (cvs.width !== ew || cvs.height !== eh) fitCanvas();
  if (now - lastT > 120) {
    const dt = Math.min((now - lastT) / 1000, 1 / 30);
    lastT = now;
    updateGame(dt);
    draw();
  }
}, 120);
// 菜单背景也需要地形
genTerrain(); buildBackground(); rebuildTerrain();
fitCanvas();
requestAnimationFrame(tick);
</script>
